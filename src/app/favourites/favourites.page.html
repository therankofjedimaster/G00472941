<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Favourites | Recipes</ion-title>
    <ion-buttons slot="end">
      <ion-button [routerLink]="['/home']">
        <ion-icon name="home"></ion-icon>
      </ion-button>
      <ion-button [routerLink]="['/favourites']">
        <ion-icon name="heart"></ion-icon>
      </ion-button>
      <ion-button [routerLink]="['/settings']">
        <ion-icon name="settings"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Favourites Recipes</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item *ngIf="isLoading && favoriteRecipes.length === 0">
    <ion-spinner name="crescent"></ion-spinner>
    <ion-label>
      <p>Loading your favourite recipes...</p>
    </ion-label>
  </ion-item>

  <ion-item *ngIf="error">
    <ion-label color="danger">
      <p>{{ error }}</p>
    </ion-label>
  </ion-item>

  <ion-item *ngIf="!isLoading && favoriteRecipes.length === 0 && !error">
    <ion-label>
      <p>You have no recipes saved as favourites yet.</p>
    </ion-label>
  </ion-item>

  <ion-list>
    <ion-card *ngFor="let recipe of favoriteRecipes">
      <img [src]="recipe.image" [alt]="recipe.title" />

      <ion-card-header>
        <ion-card-title>{{ recipe.title }}</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-button size="small" color="primary" [routerLink]="['/recipes', recipe.id]">
          DETAILS
        </ion-button>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
